<aside id="tracklist-column" class="tracklist-panel" aria-labelledby="tracklist-title" aria-hidden="true" hidden inert>
  <!-- Interactive tracklist will be populated here by JS -->
  <div class="tracklist-heading">
    <h3 class="section-title" id="tracklist-title">Tracklist</h3>
    <button class="tracklist-close" type="button" aria-label="Close tracklist">Close</button>
  </div>
  <!-- Container for draggable track items - populated by music player -->
  <div id="track-items-container" class="track-items-container-class">
    <!-- Track items will be dynamically generated by the music player -->
  </div>
</aside>
