<aside id="clock-widget-panel" class="clock-widget-panel" aria-labelledby="profile-card-name">
  <!-- Profile Card (Replaces Clock Widget) -->
  <div class="profile-card-container">
      <div class="bento-profile-header">
          <div class="profile-avatar-wrapper">
              <!-- Using pfp.webp as per existing assets -->
              <img src="./assets/picture/pfp.webp" alt="Akmal Alif" class="profile-avatar">
              <span class="verified-badge">✓</span>
          </div>
          <h2 class="profile-name" id="profile-card-name">Akmal Alif</h2>
          <p class="profile-handle">exe0x0</p>
      </div>
      
      <div class="profile-bio">
          Student | UKM | IT | Software Engineering | Exploring LLMs
      </div>
      
      <div class="profile-location">
          Bandar Baru Bangi, Selangor
      </div>
      
      <div class="profile-stats">
          <div class="stat-row">
              <span class="stat-label">Profile views</span>
              <span class="stat-value" id="profile-views-value" data-metric="profile_views">—</span>
          </div>
          <div class="stat-row">
              <span class="stat-label">Post impressions</span>
              <span class="stat-value" id="post-impressions-value" data-metric="post_impressions">—</span>
          </div>
      </div>
      <p class="profile-metrics-status" data-metrics-status role="status" aria-live="polite" hidden>Profile statistics are unavailable.</p>
  </div>
</aside>
