<aside id="clock-widget-panel" class="clock-widget-panel" aria-labelledby="profile-focus-title">
  <div class="profile-card-container">
      <div class="bento-profile-header" data-skill-focus>
          <h2 class="profile-focus-title" id="profile-focus-title">Current focus</h2>
          <div class="skill-focus-radar">
              <svg class="skill-focus-radar-svg" data-skill-focus-radar viewBox="0 0 240 240" role="img" aria-labelledby="skill-focus-radar-title skill-focus-radar-description">
                  <title id="skill-focus-radar-title">Current focus radar</title>
                  <desc id="skill-focus-radar-description">The chart shows relative research and project focus across six areas. A text equivalent lists every area below.</desc>
                  <g data-radar-axes aria-hidden="true"></g>
                  <g data-radar-rings aria-hidden="true"></g>
                  <polygon data-radar-area aria-hidden="true"></polygon>
                  <polygon data-radar-outline aria-hidden="true"></polygon>
                  <g data-radar-nodes aria-hidden="true"></g>
                  <g data-radar-labels aria-hidden="true"></g>
              </svg>
              <p class="sr-only" data-skill-focus-summary></p>
          </div>
      </div>
      
      <div class="profile-bio">
          Student | UKM | IT | Software Engineering | Exploring LLMs
      </div>
      
      <div class="profile-location">
          Bandar Baru Bangi, Selangor
      </div>
      
      <div class="profile-stats">
          <div class="stat-row">
              <span class="stat-label">Profile views</span>
              <span class="stat-value" id="profile-views-value" data-metric="profile_views">—</span>
          </div>
          <div class="stat-row">
              <span class="stat-label">Post impressions</span>
              <span class="stat-value" id="post-impressions-value" data-metric="post_impressions">—</span>
          </div>
      </div>
      <p class="profile-metrics-status" data-metrics-status role="status" aria-live="polite" hidden>Profile statistics are unavailable.</p>
  </div>
</aside>
