<!-- Shared grid and grain backdrop. Visual rules live in css/tactile.css. -->
<div class="animated-grid-background" aria-hidden="true">
  <div class="grid-base"></div>
  <div class="grid-pattern" id="gridPattern"></div>
  <div class="grid-overlay"></div>
</div>

<script>
  (() => {
    const pattern = document.getElementById('gridPattern');
    if (!pattern || window.__portfolioGridInitialized) return;
    window.__portfolioGridInitialized = true;

    const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) return;

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let frameId;

    const updateTarget = (event) => {
      targetX = ((event.clientX / window.innerWidth) - 0.5) * 8;
      targetY = ((event.clientY / window.innerHeight) - 0.5) * 8;
    };

    const animate = () => {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;
      pattern.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
      frameId = window.requestAnimationFrame(animate);
    };

    window.addEventListener('mousemove', updateTarget, { passive: true });
    animate();

    window.addEventListener('pagehide', () => {
      window.removeEventListener('mousemove', updateTarget);
      window.cancelAnimationFrame(frameId);
      window.__portfolioGridInitialized = false;
    }, { once: true });

    window.AnimatedGridBackground = {
      destroy() {
        window.removeEventListener('mousemove', updateTarget);
        window.cancelAnimationFrame(frameId);
        window.__portfolioGridInitialized = false;
      },
    };
  })();
</script>
