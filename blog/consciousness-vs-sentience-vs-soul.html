<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Akmal Alif</title>
    <link rel="icon" href="../icon/ig.ico" type="image/x-icon">
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../assets/fonts/web-fonts.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tactile.css">
    <link rel="stylesheet" href="../css/blog-styles.css">
    <script type="module" src="../js/profile-metrics.js"></script>
</head>
<body class="blog-page">
    <div id="animated-background-placeholder"></div>
    <div id="site-header-placeholder"></div>

    <div class="main-container blog-page-container">
        <main class="card blog-post-full" aria-labelledby="blog-post-title">
            <header class="blog-post-header">
                <h1 id="blog-post-title" data-blog-title>Loading Blog Post</h1>
                <p class="post-meta" data-blog-meta></p>
            </header>
            <hr class="post-separator">
            <div id="blog-outline-container" hidden></div>
            <article class="blog-content" data-blog-content></article>
            <nav class="post-navigation" aria-label="Article navigation">
                <a class="post-navigation-link" href="/blogs">
                    <svg class="post-navigation-arrow" aria-hidden="true" focusable="false" viewBox="0 0 16 16">
                        <path d="M7 2 1 8l6 6v-4h8V6H7V2Z"></path>
                    </svg>
                    <span>Back to Blog</span>
                </a>
            </nav>
        </main>
    </div>

    <script src="../js/custom-cursor.js"></script>
    <script type="module" src="../js/modules/musicPlayer.js"></script>
    <script type="module" src="../js/modules/playerIntegration.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/mobile-menu.js"></script>
    <script type="module" src="../js/blog-post.js"></script>
</body>
</html>
